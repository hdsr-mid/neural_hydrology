[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hdsr-neural-hydrology"
version = "0.1.0"
description = "HDSR Neural Hydrology experiment scripts and preprocessing"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Core NeuralHydrology
    "neuralhydrology>=1.13,<1.14",

    # Numerical stack
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scipy==1.15.3",
    "scikit-learn==1.6.1",
    "xarray>=2024.1,<2027.0",
    "netcdf4>=1.7,<2.0",

    # Geospatial
    "geopandas==0.14.4",
    "rasterio==1.4.3",
    "rasterstats==0.20.0",
    "affine==2.4.0",

    # GRIB / ECMWF
    # eccodes >=2.43 uses the newer eccodeslib packaging path,
    # which currently crashes on our Databricks runtime with
    # OPENSSL_FORCE_FIPS_MODE=0.
    "cfgrib>=0.9.15,<0.10",
    "eccodes>=2.42,<2.43",

    # Plotting / dashboards
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "plotly>=5.0,<8.0",
    "dash>=2.18,<3.0",

    # Hydrology / ML tooling
    "hydroeval>=0.1,<1.0",
    "tensorboard>=2.14,<3.0",
    "mlflow>=3.10,<4.0",
    "optuna>=4.7,<6.0",
    "tqdm>=4.62,<5.0",

    # Utilities
    "pyyaml>=6.0,<7.0",
    "names-generator>=0.2,<1.0",
    "python-dotenv>=1.0,<2.0",

    # Local development
    "jupyter>=1.0,<2.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]