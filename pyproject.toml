[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hdsr-neural-hydrology"
version = "0.1.0"
description = "HDSR Neural Hydrology experiment scripts and preprocessing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "neuralhydrology>=1.7.0",
    "numpy==1.26.4",
    "geopandas==0.14.4",
    "rasterio==1.4.3",
    "rasterstats==0.20.0",
    "affine==2.4.0",
    "pandas>=1.3.0",
    "torch==2.2.0",
    "torchvision>=0.10.0",
    "matplotlib>=3.4.0",
    "seaborn==0.11.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "xarray>=0.19.0",
    "netcdf4>=1.5.7",
    "cfgrib>=0.9.10",
    "ecmwflibs>=0.6.0",
    "eccodes>=2.0.0",
    "pyyaml>=5.4.0",
    "tensorboard>=2.6.0",
    "jupyter>=1.0.0",
    "plotly>=5.0.0",
    "dash>=2.18.0,<3.0",
    "hydroeval>=0.1.0",
    "tqdm>=4.62.0",
    "mlflow>=3.10.0",
    "optuna>=4.7.0",
    "names-generator>=0.2.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
